[Service]
# Keep synchronous API work below the Neon transaction-pool capacity. This
# leaves database headroom for health checks, deployments, and admin traffic
# when employee agents reconnect together after an outage.
Environment=DATABASE_POOL_SIZE=10
Environment=DATABASE_MAX_OVERFLOW=2
Environment=DATABASE_POOL_TIMEOUT_SECONDS=5
Environment=API_THREAD_POOL_SIZE=12
