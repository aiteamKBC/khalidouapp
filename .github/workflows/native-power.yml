name: Windows suspend and wake on dedicated test VM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suspend-wake:
    runs-on: [self-hosted, Windows, X64, khaliduo-power-vm]
    timeout-minutes: 10
    env:
      KHALIDUO_NATIVE_TEST_VM: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ./e2e/native/Test-WindowsTime.ps1 -IncludeSleep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-power-results
          path: test-reports/
